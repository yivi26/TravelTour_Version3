<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard hướng dẫn viên - TravelTour</title>
    <link rel="stylesheet" href="../../assets/css/guide/tongquan.css" />
  
    <link rel="stylesheet" href="/assets/css/common/app-toast.css" />
    <script src="/assets/js/common/app-toast.js"></script>

  </head>

  <body>
    <div class="dashboard">
      <header class="topbar">
        <div class="topbar-left">
          <div class="brand">
            <a href="tongquan.html" class="logo">TravelTour</a>
            <div class="brand-sub">Hướng dẫn viên</div>
          </div>
        </div>

        <div class="topbar-right">
          <div class="guide-noti-wrap">
            <button
              type="button"
              class="guide-noti-bell"
              aria-label="Thông báo"
              aria-expanded="false"
            >
              <svg
                class="guide-noti-bell__icon"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M18 8a6 6 0 10-12 0c0 7-3 7-3 9h18s-3-2-3-9"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M13.73 21a2 2 0 01-3.46 0"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
              <span class="guide-noti-bell__dot" hidden></span>
            </button>
          </div>
          <div class="user-info">
            <p class="user-name" id="topbarUserName">Đang tải...</p>
            <p class="user-role" id="topbarUserRole">Hướng dẫn viên</p>
          </div>

          <img
            class="user-avatar"
            id="topbarUserAvatar"
            src="https://ui-avatars.com/api/?name=User&background=16a34a&color=fff"
            alt="Guide Avatar"
          />
        </div>
      </header>

      <div class="dashboard-body">
        <aside class="sidebar">
          <nav class="sidebar-menu">
            <a href="tongquan.html" class="menu-item active">
              <span class="menu-icon">📊</span>
              <span>Dashboard</span>
            </a>

            <a href="lichtrinh.html" class="menu-item">
              <span class="menu-icon">🕘</span>
              <span>Lịch trình của tôi</span>
            </a>

            <a href="tourdangdan.html" class="menu-item">
              <span class="menu-icon">📅</span>
              <span>Tour đang dẫn</span>
            </a>

            <a href="khachhang.html" class="menu-item">
              <span class="menu-icon">👥</span>
              <span>Khách hàng</span>
            </a>

            <a href="thunhap.html" class="menu-item">
              <span class="menu-icon">💰</span>
              <span>Thu nhập</span>
            </a>

            <a href="hosocanhan.html" class="menu-item">
              <span class="menu-icon">👤</span>
              <span>Hồ sơ cá nhân</span>
            </a>

            <button class="menu-item logout-btn" type="button" id="logoutBtn">
              <span class="menu-icon">🚪</span>
              <span>Đăng xuất</span>
            </button>
          </nav>
        </aside>

        <main class="main-content">
          <div class="page-container guide-dashboard-page">
            <section class="page-header">
              <h1>Dashboard</h1>
              <p>Tổng quan hoạt động của hướng dẫn viên</p>
            </section>

            <section class="stats-grid" id="statsGrid"></section>

            <section class="card section-card">
              <h3 class="section-title">Tour sắp diễn ra</h3>
              <div class="upcoming-list" id="upcomingToursList"></div>
            </section>

            <section class="actions-grid" id="quickActionsGrid"></section>
          </div>
        </main>
      </div>
    </div>

        <script src="../../assets/js/auth/account-lock-fetch.js"></script>
    <script src="../../assets/js/guide/guideFetch.js"></script>
    <script src="../../assets/js/guide/guide-notifications.js"></script>
    <script src="../../assets/js/guide/guideTopbar.js"></script>
    <script src="../../assets/js/guide/tongquan.js"></script>
  </body>
</html>
